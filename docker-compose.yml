version: '3.8'

services:
  # 1. Base de Datos Relacional Principal
  postgres:
    image: postgres:15-alpine
    container_name: apuestec_db
    restart: always
    environment:
      POSTGRES_USER: apuestec_admin
      POSTGRES_PASSWORD: apuestec_secure_password123
      POSTGRES_DB: apuestec
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apuestec_admin -d apuestec"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Base de Datos en Memoria para Caché e Hilo de Posiciones (Leaderboard)
  redis:
    image: redis:7-alpine
    container_name: apuestec_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. API Backend (Go + Gin Gonic)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apuestec_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GIN_MODE=debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Frontend Web (Next.js App)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apuestec_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
